<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher - Browser Test Version</title>
    <style>
        :root {
            /* Spacing Scale */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 12px;
            --spacing-lg: 16px;
            --spacing-xl: 20px;
            --spacing-2xl: 24px;
            --spacing-3xl: 32px;
            --spacing-4xl: 40px;
            --spacing-5xl: 48px;
            --spacing-6xl: 64px;

            /* Modern brand palette - inspired by iOS 18 and macOS Sequoia */
            --color-primary: #007aff;
            --color-primary-hover: #0051d5;
            --color-primary-rgb: 0, 122, 255;
            --color-primary-dark: #0040dd;
            --color-primary-light: #5ac8fa;
            --color-accent: #5e5ce6;
            --color-accent-secondary: #af52de;

            /* Apple Liquid Glass color system */
            --color-background: #0a0a0a;
            --color-background-secondary: #1c1c1e;
            --color-surface: rgba(28, 28, 30, 0.64);
            --color-surface-secondary: rgba(44, 44, 46, 0.68);
            --color-surface-tertiary: rgba(58, 58, 60, 0.72);
            --color-surface-hover: rgba(72, 72, 74, 0.76);
            --color-border: rgba(84, 84, 88, 0.48);
            --color-border-hover: rgba(99, 99, 102, 0.52);

            /* Apple glass materials with modern colors */
            --glass-regular: rgba(255, 255, 255, 0.08);
            --glass-regular-border: rgba(255, 255, 255, 0.16);
            --glass-clear: rgba(255, 255, 255, 0.05);
            --glass-clear-border: rgba(255, 255, 255, 0.12);
            --glass-tinted: rgba(0, 122, 255, 0.12);
            --glass-tinted-border: rgba(0, 122, 255, 0.24);
            --glass-accent: rgba(94, 92, 230, 0.10);
            --glass-accent-border: rgba(94, 92, 230, 0.22);

            /* Dark theme text colors */
            --color-text-primary: #ffffff;
            --color-text-secondary: rgba(255, 255, 255, 0.68);
            --color-text-tertiary: rgba(255, 255, 255, 0.55);
            --color-text-quaternary: rgba(255, 255, 255, 0.36);
            --color-text-inverse: #000000;

            /* Dark theme status colors */
            --color-success: #30d158;
            --color-success-light: rgba(48, 209, 88, 0.12);
            --color-error: #ff453a;
            --color-error-light: rgba(255, 69, 58, 0.12);
            --color-warning: #ff9f0a;
            --color-warning-light: rgba(255, 159, 10, 0.12);

            /* Typography - Apple system fonts */
            --font-family-primary: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
            --font-size-xs: 0.75rem;
            --font-size-sm: 0.875rem;
            --font-size-base: 1rem;
            --font-size-lg: 1.125rem;
            --font-size-xl: 1.25rem;
            --font-size-2xl: 1.5rem;
            --font-size-3xl: 1.875rem;
            --font-weight-normal: 400;
            --font-weight-medium: 500;
            --font-weight-semibold: 600;
            --font-weight-bold: 700;

            /* Apple-style border radius */
            --border-radius-sm: 6px;
            --border-radius-md: 8px;
            --border-radius-lg: 12px;
            --border-radius-xl: 16px;
            --border-radius-2xl: 20px;

            /* Apple Liquid Glass shadows and blur */
            --blur-regular: 20px;
            --blur-strong: 32px;
            --blur-subtle: 12px;
            --shadow-glass-sm: 0 1px 4px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.24);
            --shadow-glass-md: 0 4px 12px rgba(0, 0, 0, 0.15), 0 2px 6px rgba(0, 0, 0, 0.25);
            --shadow-glass-lg: 0 8px 24px rgba(0, 0, 0, 0.18), 0 4px 12px rgba(0, 0, 0, 0.28);
            --shadow-glass-xl: 0 16px 48px rgba(0, 0, 0, 0.22), 0 8px 24px rgba(0, 0, 0, 0.32);

            /* Layout */
            --container-max-width: 28rem;
            --mobile-padding: 1rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-primary);
            background: var(--color-background);
            background-image:
                radial-gradient(circle at 20% 80%, rgba(0, 122, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(94, 92, 230, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(175, 82, 222, 0.08) 0%, transparent 50%);
            min-height: 100vh;
            padding: var(--spacing-xl) var(--mobile-padding);
            color: var(--color-text-primary);
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: var(--container-max-width);
            background: var(--glass-regular);
            backdrop-filter: blur(var(--blur-regular)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur-regular)) saturate(180%);
            border: 1px solid var(--glass-regular-border);
            border-radius: var(--border-radius-2xl);
            box-shadow: var(--shadow-glass-xl);
            overflow: hidden;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.1) 0%,
                rgba(255, 255, 255, 0.05) 25%,
                rgba(255, 255, 255, 0.02) 50%,
                rgba(255, 255, 255, 0.05) 75%,
                rgba(255, 255, 255, 0.1) 100%
            );
            pointer-events: none;
            opacity: 0.6;
        }

        .container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg,
                var(--color-primary) 0%,
                var(--color-primary-light) 50%,
                var(--color-primary) 100%);
            z-index: 2;
        }

        .header {
            background: var(--glass-tinted);
            backdrop-filter: blur(var(--blur-subtle)) saturate(200%);
            -webkit-backdrop-filter: blur(var(--blur-subtle)) saturate(200%);
            border-bottom: 1px solid var(--glass-tinted-border);
            color: var(--color-text-primary);
            padding: var(--spacing-xl) var(--spacing-2xl);
            text-align: center;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.08) 0%,
                rgba(255, 255, 255, 0.03) 25%,
                rgba(0, 122, 255, 0.06) 50%,
                rgba(255, 255, 255, 0.03) 75%,
                rgba(255, 255, 255, 0.08) 100%
            );
            pointer-events: none;
            animation: liquidShimmer 4s ease-in-out infinite;
        }

        @keyframes liquidShimmer {
            0%, 100% {
                opacity: 0.4;
                transform: translateX(-2px);
            }
            25% {
                opacity: 0.7;
                transform: translateX(1px);
            }
            50% {
                opacity: 0.6;
                transform: translateX(0px);
            }
            75% {
                opacity: 0.8;
                transform: translateX(-1px);
            }
        }

        .header h1 {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-bold);
            margin-bottom: var(--spacing-xs);
            position: relative;
            z-index: 1;
            color: var(--color-text-primary);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .header p {
            color: rgba(248, 250, 252, 0.95);
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-medium);
            position: relative;
            z-index: 1;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .content {
            padding: var(--spacing-xl) var(--spacing-2xl) var(--spacing-lg);
        }

        .form-group {
            margin-bottom: var(--spacing-md);
        }

        .form-group label {
            display: block;
            margin-bottom: var(--spacing-xs);
            font-weight: var(--font-weight-medium);
            color: var(--color-text-primary);
            font-size: var(--font-size-sm);
        }

        .form-group input {
            width: 100%;
            padding: var(--spacing-md) var(--spacing-lg);
            border: 1px solid var(--glass-clear-border);
            border-radius: var(--border-radius-lg);
            font-size: var(--font-size-base);
            font-family: var(--font-family-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--glass-clear);
            backdrop-filter: blur(var(--blur-subtle)) saturate(150%);
            -webkit-backdrop-filter: blur(var(--blur-subtle)) saturate(150%);
            color: var(--color-text-primary);
            box-shadow: var(--shadow-glass-sm);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--glass-tinted-border);
            background: var(--glass-tinted);
            box-shadow:
                var(--shadow-glass-md),
                0 0 0 3px rgba(var(--color-primary-rgb), 0.15);
            transform: translateY(-1px);
        }

        .form-group input:hover {
            border-color: var(--glass-regular-border);
            background: var(--glass-regular);
            box-shadow: var(--shadow-glass-md);
            transform: translateY(-0.5px);
        }

        .btn {
            width: 100%;
            padding: var(--spacing-md) var(--spacing-lg);
            background: linear-gradient(135deg,
                var(--color-primary) 0%,
                var(--color-primary-dark) 100%);
            color: var(--color-text-primary);
            border: 1px solid rgba(var(--color-primary-rgb), 0.3);
            border-radius: var(--border-radius-lg);
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-semibold);
            font-family: var(--font-family-primary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: var(--spacing-sm);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(var(--blur-subtle)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur-subtle)) saturate(180%);
            box-shadow: var(--shadow-glass-md);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glass-lg);
            background: linear-gradient(135deg,
                var(--color-primary-light) 0%,
                var(--color-primary) 100%);
            border-color: rgba(var(--color-primary-rgb), 0.5);
        }

        .btn:active {
            transform: translateY(-1px);
            box-shadow: var(--shadow-glass-md);
        }

        .error {
            background: var(--color-error-light);
            color: var(--color-error);
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--border-radius-lg);
            margin-bottom: var(--spacing-lg);
            font-size: var(--font-size-sm);
            border-left: 4px solid var(--color-error);
        }

        .success {
            background: var(--color-success-light);
            color: var(--color-success);
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--border-radius-lg);
            margin-bottom: var(--spacing-lg);
            font-size: var(--font-size-sm);
            border-left: 4px solid var(--color-success);
        }

        .hidden {
            display: none;
        }

        .text-center {
            text-align: center;
        }

        .link {
            color: var(--color-primary);
            cursor: pointer;
            text-decoration: none;
            font-weight: var(--font-weight-medium);
            transition: color 0.2s ease;
        }

        .link:hover {
            color: var(--color-primary-hover);
            text-decoration: underline;
        }

        .debug-log {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-width: 300px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 10000;
            border: 1px solid #333;
        }

        .test-status {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 122, 255, 0.9);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 600;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Cipher</h1>
            <p>Browser Test Version - No Tauri Required</p>
        </div>

        <div class="content">
            <!-- Register Form -->
            <div id="registerForm">
                <div id="registerError" class="error hidden"></div>
                <div id="registerSuccess" class="success hidden"></div>

                <div class="form-group">
                    <label for="registerUsername">Username</label>
                    <input type="text" id="registerUsername" required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" required>
                </div>

                <div style="margin-top: var(--spacing-xl);">
                    <button id="createAccountBtn" class="btn">Create Account</button>
                </div>

                <div class="text-center">
                    <span class="link" onclick="showLogin()">Already have an account? Sign in</span>
                </div>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="hidden">
                <div id="loginError" class="error hidden"></div>

                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required>
                </div>

                <button class="btn" onclick="handleLogin()">Sign In</button>

                <div class="text-center">
                    <span class="link" onclick="showRegister()">Don't have an account? Sign up</span>
                </div>
            </div>

            <!-- Dashboard -->
            <div id="dashboard" class="hidden">
                <div class="text-center">
                    <h2>Welcome to Cipher!</h2>
                    <p>Browser test successful! JavaScript is working correctly.</p>
                    <button class="btn" style="margin-top: 20px;" onclick="showRegister()">Back to Registration</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Debug Log -->
    <div id="debugLog" class="debug-log">
        <strong>Debug Log:</strong><br>
        <div id="debugMessages"></div>
    </div>

    <!-- Test Status -->
    <div id="testStatus" class="test-status">
        Initializing...
    </div>

    <script>
        console.log('🚀 Browser test version - JavaScript loading...');

        let debugMessages = [];
        let currentUser = null;

        // Debug logging function
        function debugLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            const logMessage = `[${timestamp}] ${message}`;
            console.log(logMessage);

            debugMessages.push(logMessage);
            if (debugMessages.length > 20) {
                debugMessages.shift(); // Keep only last 20 messages
            }

            const debugDiv = document.getElementById('debugMessages');
            if (debugDiv) {
                debugDiv.innerHTML = debugMessages.join('<br>');
                debugDiv.scrollTop = debugDiv.scrollHeight;
            }
        }

        // Mock Tauri API for testing
        const mockTauriAPI = {
            register_user: async function(params) {
                debugLog(`Mock register_user called with: ${JSON.stringify(params)}`);
                await new Promise(resolve => setTimeout(resolve, 500)); // Simulate network delay

                // Simulate successful registration
                const user = {
                    id: Math.floor(Math.random() * 1000) + 1,
                    username: params.username,
                    email: params.email,
                    created_at: new Date().toISOString()
                };

                debugLog(`Mock registration successful: ${JSON.stringify(user)}`);
                return user;
            },

            login_user: async function(params) {
                debugLog(`Mock login_user called with: ${JSON.stringify(params)}`);
                await new Promise(resolve => setTimeout(resolve, 300));

                // Simple mock validation
                if (params.username && params.password) {
                    const user = {
                        id: 1,
                        username: params.username,
                        created_at: new Date().toISOString()
                    };
                    debugLog(`Mock login successful: ${JSON.stringify(user)}`);
                    return user;
                }

                throw new Error('Invalid credentials');
            }
        };

        // Show/hide forms
        function showLogin() {
            debugLog('Showing login form');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            clearErrors();
        }

        function showRegister() {
            debugLog('Showing register form');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            clearErrors();
        }

        function showDashboard() {
            debugLog('Showing dashboard');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            clearErrors();
        }

        function clearErrors() {
            document.querySelectorAll('.error, .success').forEach(el => {
                el.classList.add('hidden');
                el.textContent = '';
            });
        }

        // Handle registration
        async function handleRegister() {
            debugLog('🎯 handleRegister function called!');

            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;

            debugLog(`Username: "${username}", Password: "${password ? '***' : 'empty'}"`);

            if (!username || !password) {
                showError('registerError', 'Please fill in required fields');
                return;
            }

            try {
                debugLog('Starting registration process...');
                updateTestStatus('Processing registration...');

                // Use mock API instead of Tauri
                const user = await mockTauriAPI.register_user({
                    username: username,
                    email: null,
                    password: password
                });

                debugLog('Registration successful!');
                currentUser = user;
                showSuccess('registerSuccess', 'Account created successfully! Redirecting...');
                updateTestStatus('Registration successful!');

                setTimeout(() => {
                    showDashboard();
                    updateTestStatus('Test completed successfully!');
                }, 1500);

            } catch (error) {
                debugLog(`Registration error: ${error.toString()}`);
                showError('registerError', 'Registration failed: ' + error);
                updateTestStatus('Registration failed');
            }
        }

        // Handle login
        async function handleLogin() {
            debugLog('handleLogin function called');

            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showError('loginError', 'Please fill in all fields');
                return;
            }

            try {
                updateTestStatus('Processing login...');
                const user = await mockTauriAPI.login_user({
                    username: username,
                    password: password
                });

                debugLog('Login successful!');
                currentUser = user;
                showDashboard();
                updateTestStatus('Login successful!');

            } catch (error) {
                debugLog(`Login error: ${error.toString()}`);
                showError('loginError', 'Login failed: ' + error);
                updateTestStatus('Login failed');
            }
        }

        // Utility functions
        function showError(elementId, message) {
            debugLog(`Showing error: ${message}`);
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.classList.remove('hidden');
        }

        function showSuccess(elementId, message) {
            debugLog(`Showing success: ${message}`);
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.classList.remove('hidden');
        }

        function updateTestStatus(status) {
            const statusElement = document.getElementById('testStatus');
            if (statusElement) {
                statusElement.textContent = status;
            }
        }

        // Test event listener functionality
        function testEventListeners() {
            debugLog('Testing event listeners...');

            const createAccountBtn = document.getElementById('createAccountBtn');
            if (createAccountBtn) {
                debugLog('✅ Create Account button found');

                // Test click handler
                createAccountBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    debugLog('✅ Create Account button clicked via event listener!');
                    handleRegister();
                });

                debugLog('✅ Event listener attached successfully');
            } else {
                debugLog('❌ Create Account button NOT found!');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            debugLog('🚀 DOMContentLoaded fired - Initializing browser test...');
            updateTestStatus('Initializing...');

            // Test basic JavaScript functionality
            debugLog('✅ JavaScript execution working');
            debugLog('✅ DOM manipulation working');
            debugLog('✅ Console logging working');

            // Test event listeners
            testEventListeners();

            // Test form elements
            const usernameField = document.getElementById('registerUsername');
            const passwordField = document.getElementById('registerPassword');

            if (usernameField && passwordField) {
                debugLog('✅ Form elements found');
            } else {
                debugLog('❌ Form elements missing');
            }

            updateTestStatus('Ready for testing');
            debugLog('🎉 Browser test initialization complete!');

            // Show register form by default
            showRegister();
        });

        // Global error handler
        window.addEventListener('error', function(e) {
            debugLog(`❌ JavaScript Error: ${e.message} at ${e.filename}:${e.lineno}`);
            updateTestStatus('JavaScript error detected');
        });

        // Test function for manual testing
        function runManualTest() {
            debugLog('🧪 Running manual test...');
            updateTestStatus('Running manual test...');

            // Simulate filling form
            document.getElementById('registerUsername').value = 'testuser123';
            document.getElementById('registerPassword').value = 'testpass123';

            debugLog('Form fields populated, triggering registration...');
            handleRegister();
        }

        // Expose test function to global scope for console testing
        window.runManualTest = runManualTest;

        debugLog('🎯 All functions loaded and ready!');
    </script>
</body>
</html>
